version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: battery_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d battery_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ERP_DATABASE_URL: postgresql://erp:erp@db:5432/battery_erp
      ERP_SECRET_KEY: local-dev-secret-change-in-prod
      ERP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn battery_erp.app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
